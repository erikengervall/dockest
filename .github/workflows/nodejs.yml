name: Node.js CI

### github.ref
# tags   refs/tags/v0.0.1
# master refs/heads/master

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ####### Print: Prints some context relating to the job to make future debugging easier
  print:
    name: Print context
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Print context 🎉
        env:
          GH_REF: ${{ github.ref }}
        run: |
          echo "GH_REF: ${GH_REF}"
          echo "docker compose version: $(docker compose version)"
          echo "docker version: $(docker version)"

  ####### Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - run: yarn prep
      - run: yarn lint

  ####### Unit tests
  unit_tests:
    name: 'Unit tests (Node ${{ matrix.node-version }})'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [18.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
      - run: yarn prep
      - run: yarn test:unit

  ####### Integration tests
  integration_tests:
    name: 'Integration tests'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          registry-url: https://registry.npmjs.org/
      - run: yarn prep
      - run: yarn test:examples --concurrency 2

  ####### Publish next to npm
  npm_publish_next:
    name: Publish next to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit_tests, integration_tests]
    if: startsWith(github.ref, 'refs/heads/master')

    # Trusted publishing: npm exchanges the job's GitHub OIDC token for a short-lived publish token
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+; the published package still supports Node 18
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11
      - name: npm publish next
        run: |
          yarn install
          node pipeline/updateNextVersion.js
          cd packages/dockest
          yarn install
          npm publish --tag next

  ####### Publish to npm
  npm_publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit_tests, integration_tests]
    if: startsWith(github.ref, 'refs/tags/')

    # Trusted publishing: npm exchanges the job's GitHub OIDC token for a short-lived publish token
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+; the published package still supports Node 18
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11
      - name: npm publish
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          cd packages/dockest
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GIT_TAG}" != "${PACKAGE_VERSION}" ]; then
            echo "Tag ${GIT_TAG} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi
          # A prerelease (v3.2.0-rc.1) publishes under its identifier (rc), never as latest
          NPM_TAG=""
          case "${GIT_TAG}" in
            *-*) PRERELEASE="${GIT_TAG#*-}"; NPM_TAG="--tag ${PRERELEASE%%.*}" ;;
          esac
          yarn install
          npm publish ${NPM_TAG}
